<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeCoSUNK (Celestial Collision Simulator Utilizing Newtonian Kinematics)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas-row">
        <div id="side-panel">
            <button onclick="displaySettings()">New Body</button>
            <div id="body-settings">
                <label for="mass-input">Mass: </label>
                <input type="text" id="mass-input">
                <label for="xpos-input">X pos: </label>
                <input type="text" id="xpos-input">
                <label for="ypos-input">Y pos: </label>
                <input type="text" id="ypos-input">
                <label for="radius-input">Radius: </label>
                <input type="text" id="radius-input">
                <button onclick="createBody()">Submit</button>
            </div>
        </div>
        <div id="canvas-col">
            <div id="time-display"></div>
            <canvas id="space" width="600" height="600"></canvas>
        </div>
    </div>
    <div id="bar"></div>
    <div id="panel">
        <span id="log"></span>
        <span id="pos"></span>
    </div>
    <script src="script.js"></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
